<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="liBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="liShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1D4ED8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Group with Shadow -->
  <g filter="url(#liShadow)">
    <!-- Left Cat Ear -->
    <path d="M 18 30 L 16 8 C 16 5 20 4 23 7 L 38 20 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 20 25 L 19 11 L 33 21 Z" fill="#FDA4AF"/>

    <!-- Right Cat Ear -->
    <path d="M 62 20 L 77 7 C 80 4 84 5 84 8 L 82 30 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 67 21 L 81 11 L 80 25 Z" fill="#FDA4AF"/>

    <!-- Main Squircle Body -->
    <rect x="10" y="18" width="80" height="74" rx="24" fill="url(#liBg)" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Anime Gloss Highlight -->
  <path d="M 12 36 C 12 24 24 20 40 20 L 60 20 C 76 20 88 24 88 36 C 60 40 32 40 12 36 Z" fill="#FFFFFF" fill-opacity="0.22"/>

  <!-- Cheerful Anime Blush Marks (Left & Right) -->
  <g fill="#FB7185" fill-opacity="0.75">
    <ellipse cx="21" cy="65" rx="5" ry="3"/>
    <ellipse cx="79" cy="65" rx="5" ry="3"/>
  </g>
  <g stroke="#1E40AF" stroke-width="1.2" stroke-linecap="round">
    <line x1="19" y1="64" x2="21" y2="67"/>
    <line x1="22" y1="64" x2="24" y2="67"/>
    <line x1="76" y1="64" x2="78" y2="67"/>
    <line x1="79" y1="64" x2="81" y2="67"/>
  </g>

  <!-- Big Bold Iconic LinkedIn 'in' Logo (Instant Recognition!) -->
  <g transform="translate(50, 56)" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.25))">
    <!-- White Bold Letter 'i' -->
    <g transform="translate(-15, -16)">
      <!-- 'i' Dot: Sparkle Star! -->
      <g transform="translate(4, 5) scale(0.6)">
        <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#FFFFFF"/>
        <circle cx="0" cy="0" r="3" fill="#BAE6FD"/>
      </g>
      <!-- 'i' Stem -->
      <rect x="0.5" y="11" width="7" height="21" rx="3" fill="#FFFFFF"/>
    </g>

    <!-- White Bold Letter 'n' -->
    <g transform="translate(2, -5)">
      <!-- Left Stem -->
      <rect x="0" y="0" width="7" height="21" rx="3" fill="#FFFFFF"/>
      <!-- Arch and Right Stem -->
      <path d="M 3 7 C 3 2 8 0 14 0 C 20 0 24 3.5 24 9.5 L 24 21 C 24 22.5 22.5 24 20.8 24 C 19 24 17.5 22.5 17.5 21 L 17.5 11 C 17.5 7.5 15.5 6 12.5 6 C 9.5 6 6.5 7.5 6.5 11 L 6.5 21 C 6.5 22.5 5 24 3.2 24 C 1.5 24 0 22.5 0 21 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Manga Sparkles -->
  <g transform="translate(80, 26) scale(0.65)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="2.5" fill="#BAE6FD"/>
  </g>
  <circle cx="24" cy="78" r="1.8" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>