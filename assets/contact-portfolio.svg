<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="pfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6366F1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Group with Shadow -->
  <g filter="url(#pfShadow)">
    <!-- Left Cat Ear -->
    <path d="M 18 30 L 16 8 C 16 5 20 4 23 7 L 38 20 Z" fill="#818CF8" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 20 25 L 19 11 L 33 21 Z" fill="#FDA4AF"/>

    <!-- Right Cat Ear -->
    <path d="M 62 20 L 77 7 C 80 4 84 5 84 8 L 82 30 Z" fill="#818CF8" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 67 21 L 81 11 L 80 25 Z" fill="#FDA4AF"/>

    <!-- Main Squircle Body -->
    <rect x="10" y="18" width="80" height="74" rx="24" fill="url(#pfBg)" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Anime Gloss Highlight -->
  <path d="M 12 36 C 12 24 24 20 40 20 L 60 20 C 76 20 88 24 88 36 C 60 40 32 40 12 36 Z" fill="#FFFFFF" fill-opacity="0.22"/>

  <!-- Cheerful Anime Blush Marks (Left & Right) -->
  <g fill="#FB7185" fill-opacity="0.75">
    <ellipse cx="21" cy="65" rx="5" ry="3"/>
    <ellipse cx="79" cy="65" rx="5" ry="3"/>
  </g>
  <g stroke="#4C1D95" stroke-width="1.2" stroke-linecap="round">
    <line x1="19" y1="64" x2="21" y2="67"/>
    <line x1="22" y1="64" x2="24" y2="67"/>
    <line x1="76" y1="64" x2="78" y2="67"/>
    <line x1="79" y1="64" x2="81" y2="67"/>
  </g>

  <!-- Big Bold Web Globe / Planet (Instant Recognition!) -->
  <g transform="translate(50, 56)" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.25))">
    <!-- Planetary Ring Behind -->
    <ellipse cx="0" cy="0" rx="26" ry="7.5" fill="none" stroke="#FDE047" stroke-width="2.5" stroke-opacity="0.4" transform="rotate(-18)"/>

    <!-- Globe Sphere -->
    <circle cx="0" cy="0" r="17" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="2.8"/>
    <!-- Latitude Line -->
    <line x1="-17" y1="0" x2="17" y2="0" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Longitude Ellipse -->
    <ellipse cx="0" cy="0" rx="8" ry="17" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>

    <!-- Planetary Ring Front -->
    <path d="M -24 6 C -18 13 18 10 24 0" fill="none" stroke="#FDE047" stroke-width="3" stroke-linecap="round" transform="rotate(-18)"/>
  </g>

  <!-- Manga Sparkles -->
  <g transform="translate(80, 26) scale(0.65)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="2.5" fill="#DDD6FE"/>
  </g>
  <circle cx="24" cy="78" r="1.8" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>