<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="emBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="emShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#DC2626" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Group with Shadow -->
  <g filter="url(#emShadow)">
    <!-- Left Cat Ear -->
    <path d="M 18 30 L 16 8 C 16 5 20 4 23 7 L 38 20 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 20 25 L 19 11 L 33 21 Z" fill="#FDA4AF"/>

    <!-- Right Cat Ear -->
    <path d="M 62 20 L 77 7 C 80 4 84 5 84 8 L 82 30 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 67 21 L 81 11 L 80 25 Z" fill="#FDA4AF"/>

    <!-- Main Squircle Body -->
    <rect x="10" y="18" width="80" height="74" rx="24" fill="url(#emBg)" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Anime Gloss Highlight -->
  <path d="M 12 36 C 12 24 24 20 40 20 L 60 20 C 76 20 88 24 88 36 C 60 40 32 40 12 36 Z" fill="#FFFFFF" fill-opacity="0.22"/>

  <!-- Cheerful Anime Blush Marks (Left & Right) -->
  <g fill="#FB7185" fill-opacity="0.75">
    <ellipse cx="21" cy="65" rx="5" ry="3"/>
    <ellipse cx="79" cy="65" rx="5" ry="3"/>
  </g>
  <g stroke="#991B1B" stroke-width="1.2" stroke-linecap="round">
    <line x1="19" y1="64" x2="21" y2="67"/>
    <line x1="22" y1="64" x2="24" y2="67"/>
    <line x1="76" y1="64" x2="78" y2="67"/>
    <line x1="79" y1="64" x2="81" y2="67"/>
  </g>

  <!-- Big Bold Iconic Gmail / Mail Envelope (Instant Recognition!) -->
  <g transform="translate(50, 56)" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.25))">
    <!-- White Envelope Base -->
    <rect x="-25" y="-17" width="50" height="34" rx="6" fill="#FFFFFF"/>
    
    <!-- Red Fold Accents (Iconic Gmail 'M' Style) -->
    <path d="M -25 -14 L -4 3 L -4 17 L -22 17 C -23.7 17 -25 15.7 -25 14 Z" fill="#EF4444" fill-opacity="0.15"/>
    <path d="M 25 -14 L 4 3 L 4 17 L 22 17 C 23.7 17 25 15.7 25 14 Z" fill="#EF4444" fill-opacity="0.15"/>

    <!-- Envelope Inner Lining Lines -->
    <path d="M -24 -15 L 0 4 L 24 -15" fill="none" stroke="#EF4444" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -24 15 L -6 -1" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <path d="M 24 15 L 6 -1" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

    <!-- Cute Red Wax Seal Heart in Center -->
    <circle cx="0" cy="4" r="6.5" fill="#E11D48" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.2))"/>
    <path d="M 0 2.2 C -1.2 0.5 -3.2 1.2 -3.2 2.8 C -3.2 4.5 0 6.5 0 6.5 C 0 6.5 3.2 4.5 3.2 2.8 C 3.2 1.2 1.2 0.5 0 2.2 Z" fill="#FFFFFF"/>
  </g>

  <!-- Manga Sparkles -->
  <g transform="translate(80, 26) scale(0.65)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="2.5" fill="#FECDD3"/>
  </g>
  <circle cx="24" cy="78" r="1.8" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>