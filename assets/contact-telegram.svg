<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="tgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Group with Shadow -->
  <g filter="url(#tgShadow)">
    <!-- Left Cat Ear -->
    <path d="M 18 30 L 16 8 C 16 5 20 4 23 7 L 38 20 Z" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 20 25 L 19 11 L 33 21 Z" fill="#FDA4AF"/>

    <!-- Right Cat Ear -->
    <path d="M 62 20 L 77 7 C 80 4 84 5 84 8 L 82 30 Z" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 67 21 L 81 11 L 80 25 Z" fill="#FDA4AF"/>

    <!-- Main Squircle Body -->
    <rect x="10" y="18" width="80" height="74" rx="24" fill="url(#tgBg)" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Anime Gloss Highlight -->
  <path d="M 12 36 C 12 24 24 20 40 20 L 60 20 C 76 20 88 24 88 36 C 60 40 32 40 12 36 Z" fill="#FFFFFF" fill-opacity="0.22"/>

  <!-- Cheerful Anime Blush Marks (Left & Right) -->
  <g fill="#FB7185" fill-opacity="0.75">
    <ellipse cx="21" cy="65" rx="5" ry="3"/>
    <ellipse cx="79" cy="65" rx="5" ry="3"/>
  </g>
  <g stroke="#E11D48" stroke-width="1.2" stroke-linecap="round">
    <line x1="19" y1="64" x2="21" y2="67"/>
    <line x1="22" y1="64" x2="24" y2="67"/>
    <line x1="76" y1="64" x2="78" y2="67"/>
    <line x1="79" y1="64" x2="81" y2="67"/>
  </g>

  <!-- Big Bold Iconic Telegram Paper Plane (Instant Recognition!) -->
  <g transform="translate(50, 56) scale(1.15)" filter="drop-shadow(0 3px 5px rgba(0,0,0,0.2))">
    <!-- White Paper Plane Body -->
    <path d="M 19 -16 L -20 0 C -22.5 1 -22 4 -19 5 L -8 8 L 13 -9 C 14 -10 15 -9 14 -8 L -4 9 L -6 17 C -6 19 -4 20 -2 18 L 4 12 L 13 17 C 16 18.5 19 17 20 14 L 23 -13 C 23.5 -16 21.5 -17.5 19 -16 Z" fill="#FFFFFF"/>
    <!-- Telegram Blue Fold Shadow -->
    <path d="M -8 8 L -4 9 L -6 17 C -6 18.5 -4.5 19 -3.5 18 L 0 14 L -8 8 Z" fill="#BAE6FD"/>
  </g>

  <!-- Manga Sparkles -->
  <g transform="translate(80, 26) scale(0.65)">
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="2.5" fill="#BAE6FD"/>
  </g>
  <circle cx="24" cy="78" r="1.8" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>